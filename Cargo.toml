[package]
name = "codegym"
version = "0.2.0"
edition = "2024"
description = "Lightweight English-language code comprehension trainer with pluggable AI providers"
license = "MIT"

[dependencies]
console = "0.16"
crossterm = "0.28"
ratatui = "0.29"
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23.2"
ureq = { version = "2.12", features = ["json"] }
url = { version = "2.5", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
