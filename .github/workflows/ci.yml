name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: "Checks (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TypeScript for semantic resolver tests
        run: npm install -g typescript@6.0.3
      - name: Resolve TypeScript compiler location
        shell: bash
        run: echo "CODEGYM_TYPESCRIPT_PATH=$(npm root -g)/typescript" >> "$GITHUB_ENV"
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
        env:
          CODEGYM_SEMANTIC_TESTS: "1"
      - name: Build test executable
        run: cargo build --locked
      - name: English-only end-to-end learning session
        run: python tests/english_e2e.py
      - name: Release build
        run: cargo build --release --locked
