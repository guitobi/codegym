[package]
name = "codegym"
version = "0.1.0"
edition = "2024"
description = "Lightweight Ukrainian code comprehension trainer powered by Codex"
license = "MIT"

[dependencies]
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
