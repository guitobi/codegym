[package]
name = "codegym"
version = "0.1.0"
edition = "2024"
description = "Lightweight Ukrainian code comprehension trainer powered by Codex"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
